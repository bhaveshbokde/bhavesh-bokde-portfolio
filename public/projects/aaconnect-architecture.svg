<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-label="High-level AAConnect architecture: client applications call a gateway API, which uses consent and financial-information services, provider adapters to multiple Account Aggregators, and PostgreSQL plus a distributed cache.">
  <title>AAConnect — high-level architecture</title>
  <desc>Generic component roles only. No internal topology, service names, endpoints or security controls are depicted. All values shown are synthetic.</desc>

  <defs>
    <linearGradient id="aa-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9cff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="aa-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b7df5" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#5b9cff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a98bff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="aa-flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#a98bff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4fd1e0" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="aa-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e2431" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="aa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b9cff" opacity="0.85"/>
    </marker>
    <marker id="aa-arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98bff" opacity="0.85"/>
    </marker>
  </defs>

  <rect width="1000" height="625" fill="#080a0f"/>
  <rect width="1000" height="625" fill="url(#aa-grid)"/>
  <ellipse cx="500" cy="300" rx="420" ry="250" fill="#8b5cf6" opacity="0.05"/>

  <!-- ============ column headings ============ -->
  <text x="130" y="52" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.5">CONSUMERS</text>
  <text x="500" y="52" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.5">AACONNECT PLATFORM</text>
  <text x="872" y="52" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.5">AA ECOSYSTEM</text>

  <!-- ============ platform boundary ============ -->
  <rect x="268" y="72" width="464" height="470" rx="18" fill="#0d1017" stroke="#2a3140" stroke-width="1.25" stroke-dasharray="7 6"/>

  <!-- ============ consumers ============ -->
  <g>
    <rect x="40" y="128" width="180" height="62" rx="12" fill="#141821" stroke="#2a3140"/>
    <circle cx="66" cy="159" r="4" fill="#5b9cff"/>
    <text x="82" y="154" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Lending app</text>
    <text x="82" y="172" fill="#68728a" font-family="ui-monospace, monospace" font-size="10.5">originates request</text>
  </g>
  <g>
    <rect x="40" y="214" width="180" height="62" rx="12" fill="#141821" stroke="#2a3140"/>
    <circle cx="66" cy="245" r="4" fill="#5b9cff"/>
    <text x="82" y="240" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Underwriting</text>
    <text x="82" y="258" fill="#68728a" font-family="ui-monospace, monospace" font-size="10.5">consumes records</text>
  </g>

  <!-- consumer -> gateway -->
  <path d="M220 159 C 252 159, 248 200, 290 200" fill="none" stroke="url(#aa-flow)" stroke-width="2" marker-end="url(#aa-arrow)"/>
  <path d="M220 245 C 252 245, 248 214, 290 212" fill="none" stroke="url(#aa-flow)" stroke-width="2" marker-end="url(#aa-arrow)"/>
  <text x="243" y="140" fill="#828da6" font-family="ui-monospace, monospace" font-size="10">REST</text>

  <!-- ============ gateway API ============ -->
  <g>
    <rect x="292" y="104" width="416" height="66" rx="13" fill="#12161f" stroke="url(#aa-core)" stroke-width="1.75"/>
    <text x="500" y="133" text-anchor="middle" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">Gateway REST API</text>
    <text x="500" y="153" text-anchor="middle" fill="#828da6" font-family="ui-monospace, monospace" font-size="10.5">validation · auth · consistent error contract</text>
  </g>

  <!-- gateway -> services -->
  <path d="M400 170 V 206" fill="none" stroke="#3a4354" stroke-width="1.5" marker-end="url(#aa-arrow)"/>
  <path d="M600 170 V 206" fill="none" stroke="#3a4354" stroke-width="1.5" marker-end="url(#aa-arrow)"/>

  <!-- ============ services ============ -->
  <g>
    <rect x="300" y="210" width="190" height="86" rx="12" fill="#141821" stroke="#2a3140"/>
    <rect x="300" y="210" width="190" height="3" rx="1.5" fill="#5b9cff" opacity="0.65"/>
    <text x="318" y="239" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Consent service</text>
    <text x="318" y="259" fill="#828da6" font-family="ui-monospace, monospace" font-size="10.5">create · status · lifecycle</text>
    <text x="318" y="277" fill="#68728a" font-family="ui-monospace, monospace" font-size="10.5">time-bound · revocable</text>
  </g>
  <g>
    <rect x="510" y="210" width="190" height="86" rx="12" fill="#141821" stroke="#2a3140"/>
    <rect x="510" y="210" width="190" height="3" rx="1.5" fill="#a98bff" opacity="0.65"/>
    <text x="528" y="239" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="14" font-weight="600">FI service</text>
    <text x="528" y="259" fill="#828da6" font-family="ui-monospace, monospace" font-size="10.5">request · fetch · status</text>
    <text x="528" y="277" fill="#68728a" font-family="ui-monospace, monospace" font-size="10.5">async callback + polling</text>
  </g>

  <!-- services -> adapters -->
  <path d="M395 296 V 334" fill="none" stroke="#3a4354" stroke-width="1.5" marker-end="url(#aa-arrow)"/>
  <path d="M605 296 V 334" fill="none" stroke="#3a4354" stroke-width="1.5" marker-end="url(#aa-arrow)"/>

  <!-- ============ adapter layer ============ -->
  <g>
    <rect x="300" y="338" width="400" height="88" rx="12" fill="#0f131b" stroke="#2a3140"/>
    <text x="318" y="364" fill="#c6cedf" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Provider adapter layer</text>
    <text x="318" y="382" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">one internal interface · per-provider quirks stay here</text>

    <rect x="318" y="392" width="84" height="22" rx="6" fill="#171c27" stroke="#2a3140"/>
    <text x="360" y="407" text-anchor="middle" fill="#8ab8ff" font-family="ui-monospace, monospace" font-size="10">adapter A</text>
    <rect x="410" y="392" width="84" height="22" rx="6" fill="#171c27" stroke="#2a3140"/>
    <text x="452" y="407" text-anchor="middle" fill="#8ab8ff" font-family="ui-monospace, monospace" font-size="10">adapter B</text>
    <rect x="502" y="392" width="84" height="22" rx="6" fill="#171c27" stroke="#2a3140"/>
    <text x="544" y="407" text-anchor="middle" fill="#8ab8ff" font-family="ui-monospace, monospace" font-size="10">adapter C</text>
    <rect x="594" y="392" width="88" height="22" rx="6" fill="#171c27" stroke="#2a3140"/>
    <text x="638" y="407" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">adapter N…</text>
  </g>

  <!-- ============ cross-cutting ============ -->
  <g>
    <rect x="300" y="444" width="195" height="74" rx="12" fill="#141821" stroke="#2a3140"/>
    <text x="318" y="469" fill="#c6cedf" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PostgreSQL</text>
    <text x="318" y="487" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">consent &amp; request state</text>
    <text x="318" y="504" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">jOOQ · Flyway migrations</text>
  </g>
  <g>
    <rect x="505" y="444" width="195" height="74" rx="12" fill="#141821" stroke="#2a3140"/>
    <text x="523" y="469" fill="#c6cedf" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Distributed cache</text>
    <text x="523" y="487" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">Hazelcast · Redis</text>
    <text x="523" y="504" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">shared across replicas</text>
  </g>

  <!-- ============ ecosystem ============ -->
  <path d="M700 382 C 748 382, 740 150, 788 150" fill="none" stroke="url(#aa-flow2)" stroke-width="2" marker-end="url(#aa-arrow-v)"/>
  <path d="M700 382 C 752 382, 744 262, 788 262" fill="none" stroke="url(#aa-flow2)" stroke-width="2" marker-end="url(#aa-arrow-v)"/>
  <path d="M700 382 C 752 382, 744 374, 788 374" fill="none" stroke="url(#aa-flow2)" stroke-width="2" marker-end="url(#aa-arrow-v)"/>

  <g>
    <rect x="790" y="120" width="172" height="60" rx="12" fill="#141821" stroke="#2a3140"/>
    <circle cx="814" cy="150" r="4" fill="#a98bff"/>
    <text x="830" y="146" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Account</text>
    <text x="830" y="163" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Aggregators</text>
  </g>
  <g>
    <rect x="790" y="232" width="172" height="60" rx="12" fill="#141821" stroke="#2a3140"/>
    <circle cx="814" cy="262" r="4" fill="#a98bff"/>
    <text x="830" y="258" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Financial Info</text>
    <text x="830" y="275" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Providers</text>
  </g>
  <g>
    <rect x="790" y="344" width="172" height="60" rx="12" fill="#141821" stroke="#2a3140"/>
    <circle cx="814" cy="374" r="4" fill="#4fd1e0"/>
    <text x="830" y="370" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Signed records</text>
    <text x="830" y="387" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">consented scope only</text>
  </g>

  <!-- reliability note -->
  <g>
    <rect x="790" y="440" width="172" height="78" rx="12" fill="#0f131b" stroke="#2a3140"/>
    <text x="808" y="463" fill="#828da6" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">RELIABILITY</text>
    <text x="808" y="482" fill="#c6cedf" font-family="ui-monospace, monospace" font-size="10.5">bounded retry</text>
    <text x="808" y="498" fill="#c6cedf" font-family="ui-monospace, monospace" font-size="10.5">idempotent paths</text>
    <text x="808" y="514" fill="#c6cedf" font-family="ui-monospace, monospace" font-size="10.5">APM tracing</text>
  </g>

  <!-- ============ footer note ============ -->
  <g>
    <rect x="40" y="562" width="920" height="34" rx="9" fill="#0d1017" stroke="#1e2431"/>
    <circle cx="62" cy="579" r="3.5" fill="#f0b35b"/>
    <text x="76" y="583" fill="#828da6" font-family="ui-monospace, monospace" font-size="10.5">Generic component roles and synthetic values. No proprietary architecture, internal service names, endpoints or security controls are shown.</text>
  </g>
</svg>
