<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-label="FinSight transactional outbox: one PostgreSQL transaction writes both the business row and an outbox event, a poller publishes to Kafka, and an idempotent consumer absorbs duplicate deliveries.">
  <title>FinSight — transactional outbox and idempotent consumption</title>

  <defs>
    <linearGradient id="fs-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b7df5"/>
      <stop offset="100%" stop-color="#5b9cff"/>
    </linearGradient>
    <pattern id="fs-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e2431" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="fs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b9cff"/>
    </marker>
    <marker id="fs-arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4e566b"/>
    </marker>
  </defs>

  <rect width="1000" height="625" fill="#080a0f"/>
  <rect width="1000" height="625" fill="url(#fs-grid)"/>
  <ellipse cx="420" cy="300" rx="380" ry="230" fill="#3b7df5" opacity="0.05"/>

  <text x="54" y="56" fill="#5b9cff" font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="3">FINSIGHT · DUAL-WRITE, SOLVED</text>
  <text x="54" y="84" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Two systems, one transaction</text>

  <!-- ============ API ============ -->
  <rect x="54" y="128" width="150" height="58" rx="12" fill="#141821" stroke="#2a3140"/>
  <text x="129" y="153" text-anchor="middle" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">CSV import</text>
  <text x="129" y="171" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">POST /api/v1/imports</text>

  <path d="M204 157 H 254" fill="none" stroke="url(#fs-accent)" stroke-width="2" marker-end="url(#fs-arrow)"/>

  <!-- ============ the transaction box ============ -->
  <rect x="258" y="112" width="312" height="190" rx="16" fill="#0d1017" stroke="#5b9cff" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.95"/>
  <rect x="278" y="100" width="212" height="24" rx="6" fill="#0d1017"/>
  <text x="384" y="117" text-anchor="middle" fill="#8ab8ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">ONE POSTGRESQL TRANSACTION</text>

  <rect x="282" y="140" width="264" height="60" rx="10" fill="#141821" stroke="#2a3140"/>
  <rect x="282" y="140" width="4" height="60" rx="2" fill="#4ad6a0"/>
  <text x="300" y="165" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">transactions</text>
  <text x="300" y="184" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">the business row · NUMERIC(19,4)</text>

  <rect x="282" y="214" width="264" height="60" rx="10" fill="#141821" stroke="#2a3140"/>
  <rect x="282" y="214" width="4" height="60" rx="2" fill="#5b9cff"/>
  <text x="300" y="239" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">outbox_events</text>
  <text x="300" y="258" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">the event row · same commit</text>

  <text x="414" y="294" text-anchor="middle" fill="#828da6" font-family="ui-monospace, monospace" font-size="10.5">both commit, or neither does</text>

  <!-- ============ poller + kafka ============ -->
  <path d="M570 207 H 628" fill="none" stroke="url(#fs-accent)" stroke-width="2" marker-end="url(#fs-arrow)"/>

  <rect x="632" y="128" width="156" height="78" rx="12" fill="#141821" stroke="#2a3140"/>
  <text x="710" y="155" text-anchor="middle" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Outbox poller</text>
  <text x="710" y="174" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">FOR UPDATE SKIP LOCKED</text>
  <text x="710" y="191" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">marks PUBLISHED on ack</text>

  <path d="M710 206 V 248" fill="none" stroke="url(#fs-accent)" stroke-width="2" marker-end="url(#fs-arrow)"/>

  <rect x="632" y="252" width="156" height="58" rx="12" fill="#12161f" stroke="#3b7df5" stroke-width="1.4"/>
  <text x="710" y="277" text-anchor="middle" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Apache Kafka</text>
  <text x="710" y="295" text-anchor="middle" fill="#8ab8ff" font-family="ui-monospace, monospace" font-size="10">at-least-once, and it says so</text>

  <!-- redelivery loop -->
  <path d="M788 281 C 846 281, 846 196, 802 190" fill="none" stroke="#4e566b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#fs-arrow-dim)"/>
  <text x="864" y="243" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="9.5">redelivery</text>

  <path d="M710 310 V 352" fill="none" stroke="url(#fs-accent)" stroke-width="2" marker-end="url(#fs-arrow)"/>

  <!-- ============ idempotency layers ============ -->
  <text x="54" y="382" fill="#5b9cff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.5">DUPLICATES ARE EXPECTED — TWO INDEPENDENT LAYERS ABSORB THEM</text>

  <rect x="54" y="398" width="440" height="110" rx="13" fill="#141821" stroke="#2a3140"/>
  <text x="76" y="426" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="14" font-weight="600">1 · processed_events ledger</text>
  <rect x="76" y="438" width="396" height="30" rx="7" fill="#0b0e14" stroke="#1e2431"/>
  <text x="90" y="458" fill="#8ab8ff" font-family="ui-monospace, monospace" font-size="11">INSERT … ON CONFLICT DO NOTHING</text>
  <text x="76" y="488" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">claimed atomically — the loser's insert affects zero rows</text>

  <rect x="516" y="398" width="430" height="110" rx="13" fill="#141821" stroke="#2a3140"/>
  <text x="538" y="426" fill="#e2e7f2" font-family="system-ui, sans-serif" font-size="14" font-weight="600">2 · partial unique index</text>
  <rect x="538" y="438" width="386" height="30" rx="7" fill="#0b0e14" stroke="#1e2431"/>
  <text x="552" y="458" fill="#c3abff" font-family="ui-monospace, monospace" font-size="11">UNIQUE (user_id, external_ref)</text>
  <text x="538" y="488" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">external_ref = sha256(fileChecksum + ':' + rowNumber)</text>

  <!-- ============ measured results ============ -->
  <rect x="54" y="528" width="892" height="64" rx="13" fill="#0d1017" stroke="#1e2431"/>

  <text x="86" y="552" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">TESTS</text>
  <text x="86" y="576" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="16" font-weight="700">336 passing</text>

  <line x1="276" y1="544" x2="276" y2="578" stroke="#1e2431"/>
  <text x="308" y="552" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">LINE COVERAGE</text>
  <text x="308" y="576" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="16" font-weight="700">80.9%</text>

  <line x1="498" y1="544" x2="498" y2="578" stroke="#1e2431"/>
  <text x="530" y="552" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">E2E ASSERTIONS</text>
  <text x="530" y="576" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="16" font-weight="700">70</text>

  <line x1="700" y1="544" x2="700" y2="578" stroke="#1e2431"/>
  <text x="732" y="552" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">MEASURED BY</text>
  <text x="732" y="576" fill="#c6cedf" font-family="system-ui, sans-serif" font-size="14" font-weight="600">JaCoCo · Surefire</text>
</svg>
