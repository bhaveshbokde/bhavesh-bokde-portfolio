<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-label="E-commerce backend concurrency: twenty simultaneous checkouts hit one conditional SQL update against five units of stock; exactly five orders are created and fifteen requests receive a 409 insufficient-stock response.">
  <title>E-commerce backend — overselling made structurally impossible</title>

  <defs>
    <linearGradient id="ec-ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ad6a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4ad6a0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ec-rej" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4e566b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4e566b" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="ec-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e2431" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="ec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ad6a0"/>
    </marker>
    <marker id="ec-arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4e566b"/>
    </marker>
  </defs>

  <rect width="1000" height="625" fill="#080a0f"/>
  <rect width="1000" height="625" fill="url(#ec-grid)"/>
  <ellipse cx="500" cy="300" rx="400" ry="240" fill="#4ad6a0" opacity="0.04"/>

  <text x="54" y="56" fill="#4ad6a0" font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="3">E-COMMERCE · CONCURRENCY-SAFE INVENTORY</text>
  <text x="54" y="84" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="22" font-weight="700">5 units. 20 simultaneous checkouts. Exactly 5 orders.</text>

  <!-- ============ 20 concurrent requests ============ -->
  <text x="54" y="128" fill="#68728a" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="2">20 CONCURRENT REQUESTS</text>

  <g>
    <rect x="54" y="142" width="150" height="330" rx="12" fill="#0d1017" stroke="#1e2431"/>
    <g font-family="ui-monospace, monospace" font-size="9.5" fill="#828da6">
      <rect x="68" y="158" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="173">POST /checkout #01</text>
      <rect x="68" y="186" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="201">POST /checkout #02</text>
      <rect x="68" y="214" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="229">POST /checkout #03</text>
      <rect x="68" y="242" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="257">POST /checkout #04</text>
      <rect x="68" y="270" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="285">POST /checkout #05</text>
      <rect x="68" y="298" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="313">POST /checkout #06</text>
      <rect x="68" y="326" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="341">POST /checkout #07</text>
      <text x="129" y="364" text-anchor="middle" fill="#4e566b" font-size="13">⋮</text>
      <rect x="68" y="376" width="122" height="22" rx="5" fill="#141821" stroke="#2a3140"/><text x="80" y="391">POST /checkout #20</text>
    </g>
    <text x="129" y="424" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="9.5">released together by</text>
    <text x="129" y="440" text-anchor="middle" fill="#c6cedf" font-family="ui-monospace, monospace" font-size="10">a CyclicBarrier</text>
    <text x="129" y="458" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="9.5">real threads, real DB</text>
  </g>

  <!-- converging lines -->
  <path d="M204 190 C 262 190, 258 280, 318 288" fill="none" stroke="#2a3140" stroke-width="1.2"/>
  <path d="M204 250 C 262 250, 262 284, 318 290" fill="none" stroke="#2a3140" stroke-width="1.2"/>
  <path d="M204 310 C 262 310, 262 296, 318 294" fill="none" stroke="#2a3140" stroke-width="1.2"/>
  <path d="M204 388 C 262 388, 262 304, 318 298" fill="none" stroke="#2a3140" stroke-width="1.2"/>

  <!-- ============ the single statement ============ -->
  <rect x="322" y="212" width="356" height="164" rx="14" fill="#0d1017" stroke="#4ad6a0" stroke-width="1.5"/>
  <text x="500" y="243" text-anchor="middle" fill="#4ad6a0" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="2">ONE CONDITIONAL STATEMENT</text>

  <rect x="342" y="256" width="316" height="82" rx="9" fill="#0b0e14" stroke="#1e2431"/>
  <g font-family="ui-monospace, monospace" font-size="11.5">
    <text x="358" y="278" fill="#8ab8ff">UPDATE</text><text x="410" y="278" fill="#c6cedf">inventory</text>
    <text x="358" y="296" fill="#8ab8ff">   SET</text><text x="410" y="296" fill="#c6cedf">available = available - :qty</text>
    <text x="358" y="314" fill="#8ab8ff"> WHERE</text><text x="410" y="314" fill="#c6cedf">product_id = :id</text>
    <text x="410" y="330" fill="#8ab8ff">AND</text><text x="444" y="330" fill="#c3abff">available &gt;= :qty</text>
  </g>

  <text x="500" y="358" text-anchor="middle" fill="#828da6" font-family="ui-monospace, monospace" font-size="10">check and decrement are the same statement — no window between them</text>

  <!-- backstop -->
  <rect x="322" y="390" width="356" height="34" rx="9" fill="#141821" stroke="#2a3140"/>
  <text x="500" y="412" text-anchor="middle" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">backstop: CHECK (available &gt;= 0)</text>

  <!-- stock meter -->
  <text x="322" y="180" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">stock</text>
  <g>
    <rect x="378" y="166" width="38" height="20" rx="5" fill="#4ad6a0" opacity="0.25" stroke="#4ad6a0"/>
    <rect x="422" y="166" width="38" height="20" rx="5" fill="#4ad6a0" opacity="0.25" stroke="#4ad6a0"/>
    <rect x="466" y="166" width="38" height="20" rx="5" fill="#4ad6a0" opacity="0.25" stroke="#4ad6a0"/>
    <rect x="510" y="166" width="38" height="20" rx="5" fill="#4ad6a0" opacity="0.25" stroke="#4ad6a0"/>
    <rect x="554" y="166" width="38" height="20" rx="5" fill="#4ad6a0" opacity="0.25" stroke="#4ad6a0"/>
    <text x="608" y="181" fill="#4ad6a0" font-family="ui-monospace, monospace" font-size="11">available = 5</text>
  </g>

  <!-- ============ outcomes ============ -->
  <path d="M678 262 H 744" fill="none" stroke="url(#ec-ok)" stroke-width="2.5" marker-end="url(#ec-arrow)"/>
  <path d="M678 330 H 744" fill="none" stroke="url(#ec-rej)" stroke-width="2.5" marker-end="url(#ec-arrow-dim)"/>

  <rect x="748" y="226" width="198" height="72" rx="12" fill="#101a16" stroke="#4ad6a0" stroke-width="1.3"/>
  <text x="770" y="252" fill="#4ad6a0" font-family="system-ui, sans-serif" font-size="20" font-weight="700">5</text>
  <text x="796" y="252" fill="#c6cedf" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">orders created</text>
  <text x="770" y="275" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">201 · stock reserved</text>
  <text x="770" y="290" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">price snapshotted</text>

  <rect x="748" y="306" width="198" height="72" rx="12" fill="#121620" stroke="#2a3140"/>
  <text x="770" y="332" fill="#828da6" font-family="system-ui, sans-serif" font-size="20" font-weight="700">15</text>
  <text x="804" y="332" fill="#828da6" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">clean rejections</text>
  <text x="770" y="355" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">409 INSUFFICIENT_STOCK</text>
  <text x="770" y="370" fill="#68728a" font-family="ui-monospace, monospace" font-size="10">zero rows affected</text>

  <text x="847" y="406" text-anchor="middle" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5">0 oversold</text>

  <!-- ============ measured results ============ -->
  <rect x="54" y="494" width="892" height="64" rx="13" fill="#0d1017" stroke="#1e2431"/>

  <text x="86" y="518" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">TESTS</text>
  <text x="86" y="542" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="16" font-weight="700">506 passing</text>

  <line x1="276" y1="510" x2="276" y2="544" stroke="#1e2431"/>
  <text x="308" y="518" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">LINE COVERAGE</text>
  <text x="308" y="542" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="16" font-weight="700">84.9%</text>

  <line x1="498" y1="510" x2="498" y2="544" stroke="#1e2431"/>
  <text x="530" y="518" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">ENDPOINTS</text>
  <text x="530" y="542" fill="#f2f5fb" font-family="system-ui, sans-serif" font-size="16" font-weight="700">38</text>

  <line x1="700" y1="510" x2="700" y2="544" stroke="#1e2431"/>
  <text x="732" y="518" fill="#4e566b" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.8">IDEMPOTENT PAYMENT</text>
  <text x="732" y="542" fill="#c6cedf" font-family="system-ui, sans-serif" font-size="14" font-weight="600">unique index</text>

  <text x="500" y="590" text-anchor="middle" fill="#4e566b" font-family="ui-monospace, monospace" font-size="10">No real money moves. The payment provider is a deterministic simulator; everything around it is real.</text>
</svg>
